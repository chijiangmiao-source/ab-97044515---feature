services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: mvscc-audit:latest
    container_name: mvscc-web
    environment:
      PORT: "8080"
    ports:
      # 宿主机端口可通过 HOST_PORT 配置（见 .env.example），默认 8080
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)\""
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # 单次验收服务：代码测试 -> 镜像构建检查 -> HTTP 冒烟，随后退出。
  # 以退出码报告验收结果：
  #   docker compose up --abort-on-container-exit --exit-code-from verify
  #   docker compose run --rm verify ; echo $?
  verify:
    build:
      context: .
      dockerfile: Dockerfile
    image: mvscc-audit:latest
    container_name: mvscc-verify
    command: ["python3", "/app/verify/run_verify.py"]
    environment:
      SMOKE_TARGET: "http://web:8080"
      PROJECT_ROOT: "/workspace"
      VERIFY_IMAGE_TAG: "mvscc-audit:verify-built"
      DOCKER_SOCK: "/var/run/docker.sock"
    volumes:
      # 镜像构建检查直接使用宿主机项目目录作为构建上下文
      - ./:/workspace
      # 经 Docker Engine API 构建镜像（容器内不装 docker CLI）
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      web:
        condition: service_healthy
    restart: "no"
